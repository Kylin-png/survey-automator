<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6e48aa;
      --primary-dark: #5a3a9b;
      --secondary: #1cb5e0;
      --accent: #7303c0;
      --success: #38ef7d;
      --warning: #ffcc00;
      --error: #ff6b6b;
      --dark: #1a1a2e;
      --darker: #16213e;
      --light-text: #e6e6e6;
      --muted-text: #a0a0a0;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
    
    body {
      width: 420px;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
      color: var(--light-text);
      overflow: hidden;
    }
    
    .container {
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    
    /* Animated Background */
    .background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.07;
      background-image: 
        radial-gradient(var(--secondary) 1px, transparent 1px),
        radial-gradient(var(--primary) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      animation: backgroundMove 120s linear infinite;
    }
    
    @keyframes backgroundMove {
      0% { background-position: 0 0, 20px 20px; }
      100% { background-position: 1000px 1000px, 1020px 1020px; }
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      padding-bottom: 15px;
    }
    
    .header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 5px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 3s ease-in-out infinite alternate;
    }
    
    @keyframes glow {
      0% { text-shadow: 0 0 5px rgba(110, 72, 170, 0.3); }
      100% { text-shadow: 0 0 15px rgba(28, 181, 224, 0.7); }
    }
    
    .header p {
      font-size: 12px;
      color: var(--muted-text);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    
    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
      border-radius: 3px;
    }
    
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .status::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }
    
    .status i {
      margin-right: 8px;
    }
    
    .status.success {
      background-color: rgba(56, 239, 125, 0.1);
      color: var(--success);
      border: 1px solid rgba(56, 239, 125, 0.2);
    }
    
    .status.success::before {
      background-color: var(--success);
    }
    
    .status.error {
      background-color: rgba(255, 107, 107, 0.1);
      color: var(--error);
      border: 1px solid rgba(255, 107, 107, 0.2);
    }
    
    .status.error::before {
      background-color: var(--error);
    }
    
    .status.info {
      background-color: rgba(28, 181, 224, 0.1);
      color: var(--secondary);
      border: 1px solid rgba(28, 181, 224, 0.2);
    }
    
    .status.info::before {
      background-color: var(--secondary);
    }
    
    .status.running {
      background-color: rgba(255, 204, 0, 0.1);
      color: var(--warning);
      border: 1px solid rgba(255, 204, 0, 0.2);
      position: relative;
    }
    
    .status.running::before {
      background-color: var(--warning);
    }
    
    .status.running::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      background: var(--warning);
      animation: loading 2s infinite linear;
    }
    
    @keyframes loading {
      0% { width: 0; }
      50% { width: 100%; }
      100% { width: 0; }
    }
    
    .button-container {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    
    .button {
      flex: 1;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(110, 72, 170, 0.3);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 38px;
    }
    
    .button i {
      margin-right: 6px;
      font-size: 14px;
    }
    
    .button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: 0.5s;
    }
    
    .button:hover::before {
      left: 100%;
    }
    
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(110, 72, 170, 0.4);
    }
    
    /* Disabled state – keep visibility/contrast */
    .button:disabled {
      /* use themed colours but desaturated for clarity */
      background: linear-gradient(135deg, rgba(110,72,170,0.5) 0%, rgba(28,181,224,0.5) 100%);
      color: rgba(255,255,255,0.75);
      cursor: not-allowed;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1) inset;
      filter: grayscale(20%);
    }
    
    .button:disabled:hover {
      transform: none;               /* keep static */
      box-shadow: 0 0 0 1px rgba(255,255,255,0.15) inset;
    }
    
    .button.start {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      box-shadow: 0 4px 10px rgba(56, 239, 125, 0.3);
    }
    
    .button.start:hover {
      box-shadow: 0 6px 15px rgba(56, 239, 125, 0.4);
    }
    
    .button.pause {
      background: linear-gradient(135deg, #f7b733 0%, #fc4a1a 100%);
      box-shadow: 0 4px 10px rgba(252, 74, 26, 0.3);
    }
    
    .button.pause:hover {
      box-shadow: 0 6px 15px rgba(252, 74, 26, 0.4);
    }
    
    .button.resume {
      background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%);
      box-shadow: 0 4px 10px rgba(0, 114, 255, 0.3);
    }
    
    .button.resume:hover {
      box-shadow: 0 6px 15px rgba(0, 114, 255, 0.4);
    }
    
    .cycle-info {
      font-size: 12px;
      color: var(--muted-text);
      text-align: center;
      margin-bottom: 15px;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    
    .cycle-info span {
      color: var(--light-text);
      font-weight: 600;
      margin-left: 5px;
    }
    
    .cycle-badge {
      background: rgba(110, 72, 170, 0.2);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--secondary);
      border: 1px solid rgba(110, 72, 170, 0.3);
    }
    
    .stats {
      font-size: 12px;
      color: var(--muted-text);
      margin-bottom: 15px;
      padding: 12px;
      background-color: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      border-left: 3px solid var(--primary);
    }
    
    .results {
      max-height: 250px;
      overflow-y: auto;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.03);
      margin-bottom: 15px;
      padding: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) rgba(255, 255, 255, 0.05);
    }
    
    .results::-webkit-scrollbar {
      width: 6px;
    }
    
    .results::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }
    
    .results::-webkit-scrollbar-thumb {
      background-color: var(--primary);
      border-radius: 3px;
    }
    
    .match-item {
      margin: 8px;
      padding: 12px;
      background-color: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      border-left: 3px solid var(--primary);
      transition: all 0.2s ease;
    }
    
    .match-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      transform: translateX(2px);
    }
    
    .question {
      font-weight: 600;
      color: var(--light-text);
      margin-bottom: 6px;
      font-size: 13px;
    }
    
    .selector {
      font-family: 'Consolas', 'Courier New', monospace;
      color: var(--muted-text);
      font-size: 11px;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 3px 6px;
      border-radius: 3px;
      word-break: break-all;
    }
    
    .api-log-container {
      margin-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 15px;
    }
    
    .api-log-header {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 13px;
      display: flex;
      align-items: center;
    }
    
    .api-log-header i {
      margin-right: 6px;
      color: var(--secondary);
    }
    
    .api-log {
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 6px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
      color: var(--muted-text);
      scrollbar-width: thin;
      scrollbar-color: var(--primary) rgba(255, 255, 255, 0.05);
    }
    
    .api-log::-webkit-scrollbar {
      width: 4px;
    }
    
    .api-log::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .api-log::-webkit-scrollbar-thumb {
      background-color: var(--primary);
      border-radius: 2px;
    }
    
    /* Pulse animation for active agent */
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(28, 181, 224, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(28, 181, 224, 0); }
      100% { box-shadow: 0 0 0 0 rgba(28, 181, 224, 0); }
    }
    
    .pulse {
      animation: pulse 2s infinite;
      border-radius: 50%;
      height: 8px;
      width: 8px;
      background: var(--secondary);
      display: inline-block;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="container">
    <div class="header">
      <h1>G.R.I.D.</h1>
      <p>Generate • Respond • Identify • Dominate</p>
    </div>
    
    <div id="status" class="status info">
      <i class="fas fa-info-circle"></i> Ready to start autonomous survey processing
    </div>
    
    <div id="cycleInfo" class="cycle-info" style="display: none;">
      <div>
        <i class="fas fa-sync-alt"></i> Cycle: <span id="cycleCount">0</span>
      </div>
      <div class="cycle-badge">
        <span class="pulse"></span><span id="currentAgent">None</span>
      </div>
    </div>
    
    <div class="button-container">
      <button id="startBtn" class="button start">
        <i class="fas fa-play"></i> Start
      </button>
      <button id="pauseResumeBtn" class="button pause" disabled>
        <i class="fas fa-pause"></i> Pause
      </button>
    </div>
    
    <div id="stats" class="stats" style="display: none;"></div>
    
    <div id="results" class="results" style="display: none;"></div>

    <div class="api-log-container">
      <div class="api-log-header">
        <i class="fas fa-terminal"></i> Operation Log:
      </div>
      <pre id="apiLog" class="api-log">System initialized. Ready for operation.</pre>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
